<script>
class Component extends DCLogic {
componentDidMount() {
try {
const root = document.documentElement;
this._onScroll = () => { root.classList.toggle('scrolled', (window.scrollY || 0) > 8); };
window.addEventListener('scroll', this._onScroll, { passive: true });
if ('IntersectionObserver' in window) {
setTimeout(() => {
try {
this._io = new IntersectionObserver((entries) => {
entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); this._io.unobserve(e.target); } });
}, { threshold: 0 });
document.querySelectorAll('.rv').forEach((el) => this._io.observe(el));
} catch (e) {}
}, 0);
}
} catch (e) {}
}
componentWillUnmount() {
try { window.removeEventListener('scroll', this._onScroll); if (this._io) { this._io.disconnect(); } } catch (e) {}
}
renderVals() {
const brand = this.props.accent ?? '#008FC9';
const picks = {
tote: { cat: 'Bags', name: 'Organic cotton tote', line: 'Screen printed on one or both sides · from 100 units' },
cap: { cat: 'Apparel', name: 'Five-panel cap', line: 'Embroidered front panel · from 50 units' },

ds: { cat: 'Bags', name: 'Recycled cotton drawstring bag', line: 'Screen printed front · from 100 units' },
nb: { cat: 'Pens and stationery', name: 'Recycled notebook A5', line: 'Debossed cover · from 50 units' }
};
const sel = (this.state || {}).sel || 'tee';
const on = (id) => (sel === id ? 'true' : 'false');
const pick = (id) => () => this.setState({ sel: id });
return {
selCat: picks[sel].cat, selName: picks[sel].name, selLine: picks[sel].line,
onTote: on('tote'), onCap: on('cap'), onTee: on('tee'), onMug: on('mug'), onDs: on('ds'), onNb: on('nb'),
pickTote: pick('tote'), pickCap: pick('cap'), pickTee: pick('tee'), pickMug: pick('mug'), pickDs: pick('ds'), pickNb: pick('nb'),
brand: brand,
accent: 'color-mix(in srgb, ' + brand + ' 76%, #000000)',
dark: 'color-mix(in srgb, ' + brand + ' 50%, #020617)',
soft: 'color-mix(in srgb, ' + brand + ' 10%, #FFFFFF)'
};
}
}
