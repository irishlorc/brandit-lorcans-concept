<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Products | Brandit Promotional Products</title>
<meta name="description" content="Browse Brandit promotional products and send one enquiry for everything you need. Price on enquiry.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#008FC9">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="512x512" href="assets/icon-512.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0;font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:#0F172A;background:#FFFFFF}
a{color:#0F172A}a:hover{color:#006E9C}
@media (max-width:720px){.bh-search{order:3;flex-basis:100% !important}.bh-cta{margin-left:auto}}
:root{--d1:120ms;--d2:220ms;--d3:480ms;--d4:800ms;--ease:cubic-bezier(.22,1,.36,1);--rise:18px}
html{scroll-behavior:smooth;-webkit-tap-highlight-color:transparent}
[id]{scroll-margin-top:110px}
:focus-visible{outline:3px solid #0F172A;outline-offset:3px}
button,.btn{transition:transform var(--d1) var(--ease),filter var(--d2) var(--ease),box-shadow var(--d2) var(--ease),background-color var(--d2) var(--ease),color var(--d2) var(--ease),border-color var(--d2) var(--ease)}
.card,.tile{transition:box-shadow var(--d2) var(--ease)}
.card img,.tile img{transition:transform var(--d3) var(--ease)}
.lnk{background:linear-gradient(currentColor,currentColor) 0 calc(100% - 8px)/0 2px no-repeat;transition:background-size var(--d2) var(--ease)}
@media (hover:hover){
.btn:hover,button:hover{filter:brightness(1.07);transform:translateY(-1px)}
.card:hover,.tile:hover{box-shadow:0 18px 40px -22px rgba(15,23,42,.45)}
.card:hover img{transform:scale(1.06) rotate(-2deg)}
.tile:hover img{transform:translate(-6px,-6px) rotate(-4deg) scale(1.06)}
.lnk:hover{background-size:100% 2px}
}
button:active,.btn:active{transform:scale(.97);filter:none}
.hdr{transition:box-shadow var(--d2) var(--ease)}
@media (min-width:721px){.hdr{position:sticky;top:0;z-index:10}}
.scrolled .hdr{box-shadow:0 10px 30px -18px rgba(2,6,23,.6)}
.bh-search{transition:box-shadow var(--d2) var(--ease)}
.bh-search:focus-within{box-shadow:0 0 0 3px #FFD400}
.nosb{scrollbar-width:none}.nosb::-webkit-scrollbar{display:none}
.field{transition:border-color var(--d2) var(--ease),box-shadow var(--d2) var(--ease)}
.field:focus{outline:none;border-color:#006E9C !important;box-shadow:0 0 0 3px rgba(0,143,201,.3)}
.field[aria-invalid="true"]{border-color:#B91C1C !important;box-shadow:0 0 0 3px rgba(185,28,28,.15)}
@media (prefers-reduced-motion:no-preference){
.rv.in{animation:rise var(--d3) var(--ease) var(--dl,0ms) both}
.rv:nth-child(2){--dl:70ms}.rv:nth-child(3){--dl:140ms}.rv:nth-child(4){--dl:210ms}.rv:nth-child(5){--dl:280ms}.rv:nth-child(6){--dl:350ms}
.hin{animation:rise var(--d4) var(--ease) both}
.hin:nth-child(3){animation-delay:140ms}.hin:nth-child(4){animation-delay:230ms}
.bar{transform-origin:left;animation:swipe var(--d4) var(--ease) 320ms both}
.hero-img{animation:press var(--d4) var(--ease) 160ms both}
.view{animation:rise var(--d3) var(--ease) both}
.grid article{animation:rise var(--d3) var(--ease) both}
.grid article:nth-child(2){animation-delay:40ms}.grid article:nth-child(3){animation-delay:80ms}.grid article:nth-child(4){animation-delay:120ms}.grid article:nth-child(5){animation-delay:160ms}.grid article:nth-child(6){animation-delay:200ms}.grid article:nth-child(7){animation-delay:240ms}.grid article:nth-child(n+8){animation-delay:280ms}
.toast{animation:toast 2600ms var(--ease) both}
.pop{animation:pop var(--d3) var(--ease)}
.draw{stroke-dasharray:44;stroke-dashoffset:44;animation:draw var(--d4) var(--ease) 200ms forwards}
@keyframes rise{from{opacity:0;transform:translateY(var(--rise))}to{opacity:1;transform:none}}
@keyframes swipe{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes press{from{opacity:0;transform:scale(.96) rotate(1.5deg)}to{opacity:1;transform:none}}
@keyframes toast{0%{opacity:0;transform:translateY(12px)}10%,80%{opacity:1;transform:none}100%{opacity:0;transform:translateY(6px)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none !important;transition:none !important}}
@media (max-width:720px){
.tb-l{display:none}
.bn{padding-left:0 !important;padding-right:0 !important}
.bn img{border-radius:0 !important}
.bn-pad{padding:0 16px}
.trust{grid-template-columns:repeat(2,minmax(0,1fr)) !important;gap:10px !important}
.trust>div{flex-direction:column;align-items:flex-start !important;gap:8px !important;padding:14px !important}
.cats{grid-template-columns:repeat(2,minmax(0,1fr)) !important;gap:10px !important}
.cats .tile{min-height:148px !important;padding:16px !important;border-radius:18px !important}
.cats .tile>span>span:first-child{font-size:17px !important;line-height:1.2}
.cats .tile>span>span:last-child{display:none}
.cats .tile img{width:84px !important;height:84px !important}
.card .det{display:none}
.view{padding-bottom:120px !important}
.steps{gap:6px !important}
.steps li{padding:7px 10px !important;font-size:12.5px}
.pills{flex-wrap:nowrap !important;overflow-x:auto;margin:0 -16px;padding:0 16px 4px}
.pills button{flex:none;white-space:nowrap}
.mbar{display:flex !important}
.toastwrap{bottom:92px !important}
}
button{font-family:inherit;cursor:pointer}
</style>
</head>
<body>
<div id="app"></div>
<template id="tpl">
<div style="background: #FFFFFF; color: #0F172A; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 16px; line-height: 1.5; min-height: 1900px">

<header class="hdr" style="background: {{brand}}; color: #FFFFFF">
<div style="max-width: 1240px; margin: 0 auto; padding: 16px 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px 28px">
<a href="index.html" style="display: flex; align-items: center; flex: none"><img decoding="async" src="assets/logo-white.png" alt="Brandit Promotional Products, home" style="height: 48px; width: auto; display: block"></a>
<div class="bh-search" style="flex: 1 1 280px; min-width: 0; display: flex; align-items: center; gap: 10px; background: #FFFFFF; color: #475569; padding: 0 18px; border-radius: 999px">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="flex: none"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<input type="search" aria-label="Search products" placeholder="Search bottles, totes, hoodies…" onChange="{{onSearch}}" style="flex: 1; min-width: 0; font: inherit; font-size: 15px; border: 0; outline-offset: 4px; background: transparent; color: #0F172A; padding: 12px 0; min-height: 22px">
</div>
<button type="button" class="bh-cta" onClick="{{goEnquiry}}" style="flex: none; border: 0; font-weight: 700; font-size: 15px; padding: 12px 20px; min-height: 46px; border-radius: 999px; background: #FFFFFF; color: {{dark}}; display: flex; align-items: center; gap: 10px">Enquiry list<sc-if value="{{countEven}}" hint-placeholder-val="{{true}}"><span class="pop" key="{{count}}" style="display: inline-block; background: {{accent}}; color: #FFFFFF; font-size: 13px; padding: 1px 9px; border-radius: 999px">{{count}}</span></sc-if><sc-if value="{{countOdd}}" hint-placeholder-val="{{false}}"><span class="pop" key="{{count}}" style="display: inline-block; background: {{accent}}; color: #FFFFFF; font-size: 13px; padding: 1px 9px; border-radius: 999px">{{count}}</span></sc-if></button>
</div>
</header>

<sc-if value="{{isShop}}" hint-placeholder-val="{{true}}">
<main class="view" key="v1" style="max-width: 1240px; margin: 0 auto; padding: clamp(24px, 3vw, 40px) clamp(16px, 3vw, 24px) 96px; display: flex; flex-direction: column; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 8px; max-width: 640px">
<h1 style="margin: 0; font-weight: 800; font-size: 40px; letter-spacing: -0.03em; line-height: 1.08">Promotional products</h1>
<p style="margin: 0; font-size: 17px; color: #475569">Add anything you like to your enquiry list. We quote every order, so there is no checkout and no payment online.</p>
</div>
<div role="group" aria-label="Filter by category" class="pills nosb" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="7">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="border: 1px solid {{c.border}}; background: {{c.bg}}; color: {{c.fg}}; font-weight: 600; font-size: 15px; padding: 10px 18px; min-height: 44px; border-radius: 999px">{{c.label}}</button>
</sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<span aria-live="polite" style="font-size: 14px; font-weight: 600; color: #475569">{{resultLabel}}</span>
<div style="display: flex; align-items: center; gap: 8px"><label for="shop-sort" style="font-size: 14px; font-weight: 600; color: #475569">Sort</label><select id="shop-sort" class="field" onChange="{{onSort}}" style="font: inherit; font-size: 14px; font-weight: 600; padding: 9px 12px; min-height: 44px; border: 1px solid #CBD5E1; border-radius: 999px; background: #FFFFFF; color: #0F172A"><option value="featured">Featured</option><option value="az">Name A to Z</option><option value="moq">Lowest minimum order</option></select></div>
</div>
<sc-if value="{{noResults}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; padding: 40px 24px; border: 1px dashed #94A3B8; border-radius: 20px; text-align: center; color: #475569">No products match that search. Try another word or category.</p>
</sc-if>
<div class="grid" key="{{gridKey}}" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 45%), 1fr)); gap: 16px">
<sc-for list="{{products}}" as="item" hint-placeholder-count="8">
<article class="card" style="border: 1px solid #E2E8F0; border-radius: 20px; padding: 12px; display: flex; flex-direction: column; gap: 12px">
<button type="button" onClick="{{item.open}}" aria-label="{{item.openLabel}}" style="border: 0; padding: 0; height: clamp(130px, 16vw, 210px); border-radius: 14px; background: {{item.tint}}; display: flex; align-items: center; justify-content: center; font-size: 13px; color: #475569"><sc-if value="{{item.mugImg}}" hint-placeholder-val="{{false}}"><img decoding="async" src="assets/mug.png" alt="" style="max-height: clamp(110px, 13.5vw, 180px); max-width: 85%"></sc-if><sc-if value="{{item.teeImg}}" hint-placeholder-val="{{false}}"><img decoding="async" src="assets/tee.png" alt="" style="max-height: clamp(110px, 13.5vw, 180px); max-width: 85%"></sc-if><sc-if value="{{item.toteImg}}" hint-placeholder-val="{{false}}"><img decoding="async" src="assets/tote.png" alt="" style="max-height: clamp(110px, 13.5vw, 180px); max-width: 85%"></sc-if><sc-if value="{{item.pbImg}}" hint-placeholder-val="{{false}}"><img decoding="async" src="assets/powerbank.png" alt="" style="max-height: clamp(110px, 13.5vw, 180px); max-width: 85%"></sc-if><sc-if value="{{item.nbImg}}" hint-placeholder-val="{{false}}"><img decoding="async" src="assets/notebook.png" alt="" style="max-height: clamp(110px, 13.5vw, 180px); max-width: 85%"></sc-if><sc-if value="{{item.dsImg}}" hint-placeholder-val="{{false}}"><img decoding="async" src="assets/drawstring.png" alt="" style="max-height: clamp(110px, 13.5vw, 180px); max-width: 85%"></sc-if><sc-if value="{{item.capImg}}" hint-placeholder-val="{{false}}"><img decoding="async" src="assets/cap.png" alt="" style="max-height: clamp(110px, 13.5vw, 180px); max-width: 85%"></sc-if><sc-if value="{{item.penImg}}" hint-placeholder-val="{{false}}"><img decoding="async" src="assets/pen.png" alt="" style="max-height: clamp(110px, 13.5vw, 180px); max-width: 85%"></sc-if><sc-if value="{{item.noImg}}" hint-placeholder-val="{{true}}">Product photo</sc-if></button>
<div style="display: flex; flex-direction: column; gap: 2px; padding: 0 6px">
<span style="font-size: 13px; font-weight: 600; color: #475569">{{item.cat}}</span>
<span style="font-weight: 700; font-size: 16px">{{item.name}}</span>
<span style="font-size: 14px; color: #475569">Price on enquiry · from {{item.moq}} units</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto">
<button type="button" onClick="{{item.toggle}}" style="flex: 1 1 130px; border: 1px solid {{item.addBorder}}; background: {{item.addBg}}; color: {{item.addFg}}; font-weight: 700; font-size: 14px; padding: 10px 12px; min-height: 44px; border-radius: 999px">{{item.addLabel}}</button>
<button type="button" class="det" onClick="{{item.open}}" style="border: 1px solid #CBD5E1; background: #FFFFFF; color: #0F172A; font-weight: 600; font-size: 14px; padding: 10px 16px; min-height: 44px; border-radius: 999px">Details</button>
</div>
</article>
</sc-for>
</div>
</main>
</sc-if>

<sc-if value="{{isProduct}}" hint-placeholder-val="{{false}}">
<main class="view" key="v2" style="max-width: 1240px; margin: 0 auto; padding: 20px 24px 96px; display: flex; flex-direction: column; gap: 20px">
<button type="button" onClick="{{goShop}}" style="align-self: flex-start; border: 0; background: transparent; color: #0F172A; font-weight: 600; font-size: 15px; padding: 10px 0; min-height: 44px; text-decoration: underline">Back to products</button>
<div style="display: flex; flex-wrap: wrap; gap: clamp(24px, 4vw, 48px); align-items: flex-start">
<div style="flex: 1 1 440px; min-width: 0; height: clamp(260px, 40vw, 520px); border-radius: 28px; background: {{p.tint}}; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #475569"><sc-if value="{{p.mugImg}}" hint-placeholder-val="{{false}}"><img decoding="async" src="assets/mug.png" alt="" style="max-height: clamp(220px, 34vw, 440px); max-width: 80%"></sc-if><sc-if value="{{p.teeImg}}" hint-placeholder-val="{{false}}"><img decoding="async" src="assets/tee.png" alt="" style="max-height: clamp(220px, 34vw, 440px); max-width: 80%"></sc-if><sc-if value="{{p.toteImg}}" hint-placeholder-val="{{false}}"><img decoding="async" src="assets/tote.png" alt="" style="max-height: clamp(220px, 34vw, 440px); max-width: 80%"></sc-if><sc-if value="{{p.pbImg}}" hint-placeholder-val="{{false}}"><img decoding="async" src="assets/powerbank.png" alt="" style="max-height: clamp(220px, 34vw, 440px); max-width: 80%"></sc-if><sc-if value="{{p.nbImg}}" hint-placeholder-val="{{false}}"><img decoding="async" src="assets/notebook.png" alt="" style="max-height: clamp(220px, 34vw, 440px); max-width: 80%"></sc-if><sc-if value="{{p.dsImg}}" hint-placeholder-val="{{false}}"><img decoding="async" src="assets/drawstring.png" alt="" style="max-height: clamp(220px, 34vw, 440px); max-width: 80%"></sc-if><sc-if value="{{p.capImg}}" hint-placeholder-val="{{false}}"><img decoding="async" src="assets/cap.png" alt="" style="max-height: clamp(220px, 34vw, 440px); max-width: 80%"></sc-if><sc-if value="{{p.penImg}}" hint-placeholder-val="{{false}}"><img decoding="async" src="assets/pen.png" alt="" style="max-height: clamp(220px, 34vw, 440px); max-width: 80%"></sc-if><sc-if value="{{p.noImg}}" hint-placeholder-val="{{true}}">Product photo</sc-if></div>
<div style="flex: 1 1 400px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; font-weight: 600; color: #475569">{{p.cat}}</span>
<h1 style="margin: 0; font-weight: 800; font-size: 38px; letter-spacing: -0.03em; line-height: 1.1">{{p.name}}</h1>
<p style="margin: 0; font-size: 17px; color: #475569; text-wrap: pretty">{{p.desc}}</p>
</div>
<dl style="margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(170px, 100%), 1fr)); gap: 12px">
<div style="background: {{soft}}; border-radius: 16px; padding: 14px 16px"><dt style="font-size: 13px; color: #334155">Branding</dt><dd style="margin: 0; font-weight: 700; font-size: 15px">{{p.method}}</dd></div>
<div style="background: {{soft}}; border-radius: 16px; padding: 14px 16px"><dt style="font-size: 13px; color: #334155">Minimum order</dt><dd style="margin: 0; font-weight: 700; font-size: 15px">{{p.moq}} units</dd></div>
<div style="background: {{soft}}; border-radius: 16px; padding: 14px 16px"><dt style="font-size: 13px; color: #334155">Lead time</dt><dd style="margin: 0; font-weight: 700; font-size: 15px">[LEAD TIME]</dd></div>
</dl>
<div style="border: 1px solid #E2E8F0; border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px">
<span style="font-weight: 700; font-size: 15px">Rough quantity</span>
<div style="display: flex; align-items: center; gap: 4px">
<button type="button" onClick="{{draftDec}}" aria-label="Decrease quantity" style="width: 44px; height: 44px; border: 1px solid #CBD5E1; background: #FFFFFF; color: #0F172A; border-radius: 999px; font-size: 20px; line-height: 1">−</button>
<span aria-live="polite" style="min-width: 72px; text-align: center; font-weight: 700; font-size: 17px">{{draft}}</span>
<button type="button" onClick="{{draftInc}}" aria-label="Increase quantity" style="width: 44px; height: 44px; border: 1px solid #CBD5E1; background: #FFFFFF; color: #0F172A; border-radius: 999px; font-size: 20px; line-height: 1">+</button>
</div>
</div>
<button type="button" onClick="{{addCurrent}}" style="border: 0; background: {{accent}}; color: #FFFFFF; font-weight: 700; font-size: 16px; padding: 15px 20px; min-height: 48px; border-radius: 999px">{{addCurrentLabel}}</button>
<span style="font-size: 14px; color: #475569">Price on enquiry. You are not ordering or paying, just asking for a quote.</span>
</div>
</div>
</div>
</main>
</sc-if>

<sc-if value="{{isEnquiry}}" hint-placeholder-val="{{false}}">
<main class="view" key="v3" style="max-width: 1240px; margin: 0 auto; padding: clamp(24px, 3vw, 40px) clamp(16px, 3vw, 24px) 96px; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-direction: column; gap: 8px; max-width: 640px">
<h1 style="margin: 0; font-weight: 800; font-size: 40px; letter-spacing: -0.03em; line-height: 1.08">Your enquiry list</h1>
<p style="margin: 0; font-size: 17px; color: #475569">Check the items and quantities, add your details and send. Nothing is ordered until you approve a quote.</p>
</div>
<sc-if value="{{noItems}}" hint-placeholder-val="{{false}}">
<div style="border: 1px dashed #94A3B8; border-radius: 20px; padding: 48px 24px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center">
<span style="font-weight: 700; font-size: 18px">Your list is empty</span>
<span style="font-size: 15px; color: #475569">Add products you are interested in and they will show up here.</span>
<button type="button" onClick="{{goShop}}" style="border: 0; background: {{accent}}; color: #FFFFFF; font-weight: 700; font-size: 15px; padding: 12px 22px; min-height: 44px; border-radius: 999px">Browse products</button>
</div>
</sc-if>
<sc-if value="{{hasItems}}" hint-placeholder-val="{{true}}">
<ol aria-label="Enquiry steps" class="steps" style="margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px; font-size: 14px; font-weight: 700">
<li style="padding: 8px 14px; border-radius: 999px; background: {{accent}}; color: #FFFFFF">1 · Your list</li>
<li style="padding: 8px 14px; border-radius: 999px; background: {{accent}}; color: #FFFFFF">2 · Your details</li>
<li style="padding: 8px 14px; border-radius: 999px; background: {{soft}}; color: #334155">3 · Quote by email</li>
</ol>
<div style="display: flex; flex-wrap: wrap; gap: 32px; align-items: flex-start">
<div style="flex: 999 1 480px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{items}}" as="row" hint-placeholder-count="3">
<div style="border: 1px solid #E2E8F0; border-radius: 20px; padding: 12px; display: flex; flex-wrap: wrap; align-items: center; gap: 16px">
<div style="width: 72px; height: 72px; border-radius: 14px; background: {{row.tint}}; flex: none; display: flex; align-items: center; justify-content: center"><sc-if value="{{row.mugImg}}" hint-placeholder-val="{{false}}"><img decoding="async" src="assets/mug.png" alt="" style="max-height: 60px; max-width: 60px"></sc-if><sc-if value="{{row.teeImg}}" hint-placeholder-val="{{false}}"><img decoding="async" src="assets/tee.png" alt="" style="max-height: 60px; max-width: 60px"></sc-if><sc-if value="{{row.toteImg}}" hint-placeholder-val="{{false}}"><img decoding="async" src="assets/tote.png" alt="" style="max-height: 60px; max-width: 60px"></sc-if><sc-if value="{{row.pbImg}}" hint-placeholder-val="{{false}}"><img decoding="async" src="assets/powerbank.png" alt="" style="max-height: 60px; max-width: 60px"></sc-if><sc-if value="{{row.nbImg}}" hint-placeholder-val="{{false}}"><img decoding="async" src="assets/notebook.png" alt="" style="max-height: 60px; max-width: 60px"></sc-if><sc-if value="{{row.dsImg}}" hint-placeholder-val="{{false}}"><img decoding="async" src="assets/drawstring.png" alt="" style="max-height: 60px; max-width: 60px"></sc-if><sc-if value="{{row.capImg}}" hint-placeholder-val="{{false}}"><img decoding="async" src="assets/cap.png" alt="" style="max-height: 60px; max-width: 60px"></sc-if><sc-if value="{{row.penImg}}" hint-placeholder-val="{{false}}"><img decoding="async" src="assets/pen.png" alt="" style="max-height: 60px; max-width: 60px"></sc-if></div>
<div style="flex: 1 1 180px; min-width: 0; display: flex; flex-direction: column; gap: 2px">
<span style="font-weight: 700; font-size: 16px">{{row.name}}</span>
<span style="font-size: 14px; color: #475569">{{row.method}}</span>
</div>
<div style="display: flex; align-items: center; gap: 4px">
<button type="button" onClick="{{row.dec}}" aria-label="{{row.decLabel}}" style="width: 44px; height: 44px; border: 1px solid #CBD5E1; background: #FFFFFF; color: #0F172A; border-radius: 999px; font-size: 20px; line-height: 1">−</button>
<span style="min-width: 64px; text-align: center; font-weight: 700; font-size: 16px">{{row.qty}}</span>
<button type="button" onClick="{{row.inc}}" aria-label="{{row.incLabel}}" style="width: 44px; height: 44px; border: 1px solid #CBD5E1; background: #FFFFFF; color: #0F172A; border-radius: 999px; font-size: 20px; line-height: 1">+</button>
</div>
<button type="button" onClick="{{row.remove}}" aria-label="{{row.removeLabel}}" style="border: 0; background: transparent; color: #475569; font-weight: 600; font-size: 14px; padding: 10px 8px; min-height: 44px; text-decoration: underline">Remove</button>
</div>
</sc-for>
<button type="button" onClick="{{goShop}}" style="align-self: flex-start; border: 0; background: transparent; color: #0F172A; font-weight: 600; font-size: 15px; padding: 10px 0; min-height: 44px; text-decoration: underline">Add more products</button>
</div>
<div style="flex: 1 1 360px; min-width: 0; background: {{soft}}; border-radius: 28px; padding: 28px; display: flex; flex-direction: column; gap: 16px; box-sizing: border-box">
<h2 style="margin: 0; font-weight: 800; font-size: 22px">Your details</h2>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="enq-name" style="font-size: 14px; font-weight: 600">Name</label><sc-if value="{{nameErr}}" hint-placeholder-val="{{false}}"><span role="alert" style="font-size: 13px; font-weight: 600; color: #B91C1C">Please add your name.</span></sc-if><input id="enq-name" type="text" autocomplete="name" required aria-invalid="{{nameInvalid}}" onChange="{{clearName}}" class="field" style="font: inherit; padding: 12px 14px; min-height: 44px; border: 1px solid #94A3B8; border-radius: 12px; background: #FFFFFF; color: #0F172A; box-sizing: border-box; width: 100%"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="enq-company" style="font-size: 14px; font-weight: 600">Company</label><input id="enq-company" type="text" autocomplete="organization" class="field" style="font: inherit; padding: 12px 14px; min-height: 44px; border: 1px solid #94A3B8; border-radius: 12px; background: #FFFFFF; color: #0F172A; box-sizing: border-box; width: 100%"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="enq-email" style="font-size: 14px; font-weight: 600">Email</label><sc-if value="{{emailErr}}" hint-placeholder-val="{{false}}"><span role="alert" style="font-size: 13px; font-weight: 600; color: #B91C1C">Please add a valid email so we can send your quote.</span></sc-if><input id="enq-email" type="email" autocomplete="email" required aria-invalid="{{emailInvalid}}" onChange="{{clearEmail}}" class="field" style="font: inherit; padding: 12px 14px; min-height: 44px; border: 1px solid #94A3B8; border-radius: 12px; background: #FFFFFF; color: #0F172A; box-sizing: border-box; width: 100%"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="enq-phone" style="font-size: 14px; font-weight: 600">Phone (optional)</label><input id="enq-phone" type="tel" autocomplete="tel" class="field" style="font: inherit; padding: 12px 14px; min-height: 44px; border: 1px solid #94A3B8; border-radius: 12px; background: #FFFFFF; color: #0F172A; box-sizing: border-box; width: 100%"></div>
<div style="display: flex; flex-direction: column; gap: 6px"><label for="enq-notes" style="font-size: 14px; font-weight: 600">Anything we should know?</label><textarea id="enq-notes" rows="4" placeholder="Deadline, colours, where your logo should go" class="field" style="font: inherit; padding: 12px 14px; border: 1px solid #94A3B8; border-radius: 12px; background: #FFFFFF; color: #0F172A; box-sizing: border-box; width: 100%; resize: vertical"></textarea></div>
<button type="button" onClick="{{send}}" style="border: 0; background: {{accent}}; color: #FFFFFF; font-weight: 700; font-size: 16px; padding: 15px 20px; min-height: 48px; border-radius: 999px">Send enquiry</button>
<span style="font-size: 14px; color: #334155">We reply within [REPLY TIME] with pricing and a mock-up.</span>
</div>
</div>
</sc-if>
</main>
</sc-if>

<sc-if value="{{isSent}}" hint-placeholder-val="{{false}}">
<main class="view" key="v4" style="max-width: 640px; margin: 0 auto; padding: 96px 24px; display: flex; flex-direction: column; align-items: center; gap: 20px; text-align: center">
<svg aria-hidden="true" width="64" height="64" viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="32" fill="{{accent}}"></circle><path class="draw" d="M20 33l8 8 17-18" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<h1 style="margin: 0; font-weight: 800; font-size: 40px; letter-spacing: -0.03em; line-height: 1.08">Enquiry sent</h1>
<p style="margin: 0; font-size: 17px; color: #475569">Thanks. We will be back to you within [REPLY TIME] with pricing, lead times and a mock-up of your logo on each item.</p>
<button type="button" onClick="{{goShop}}" style="border: 0; background: {{accent}}; color: #FFFFFF; font-weight: 700; font-size: 15px; padding: 12px 22px; min-height: 44px; border-radius: 999px">Back to products</button>
</main>
</sc-if>

<div role="status" aria-live="polite" class="toastwrap" style="position: fixed; left: 0; right: 0; bottom: 24px; z-index: 30; display: flex; justify-content: center; pointer-events: none">
<sc-if value="{{toastA}}" hint-placeholder-val="{{false}}"><div class="toast" style="background: #0F172A; color: #FFFFFF; font-size: 15px; font-weight: 600; padding: 12px 18px; border-radius: 999px; box-shadow: 0 16px 40px -18px rgba(2,6,23,.7); white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis">{{toastText}}</div></sc-if>
<sc-if value="{{toastB}}" hint-placeholder-val="{{false}}"><div class="toast" style="background: #0F172A; color: #FFFFFF; font-size: 15px; font-weight: 600; padding: 12px 18px; border-radius: 999px; box-shadow: 0 16px 40px -18px rgba(2,6,23,.7); white-space: nowrap; max-width: 92vw; overflow: hidden; text-overflow: ellipsis">{{toastText}}</div></sc-if>
</div>
<sc-if value="{{showBar}}" hint-placeholder-val="{{false}}">
<div class="mbar" style="display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 12px 16px; background: #FFFFFF; border-top: 1px solid #E2E8F0">
<button type="button" onClick="{{goEnquiry}}" style="flex: 1; border: 0; background: {{accent}}; color: #FFFFFF; font-weight: 700; font-size: 16px; padding: 14px 20px; min-height: 52px; border-radius: 999px">{{barLabel}}</button>
</div>
</sc-if>

</div>
</template>
<script src="dc-lite.js"></script>
<script>
class Component extends DCLogic {
componentDidMount() {
try {
const root = document.documentElement;
this._onScroll = () => { root.classList.toggle('scrolled', (window.scrollY || 0) > 8); };
window.addEventListener('scroll', this._onScroll, { passive: true });
} catch (e) {}
}
componentWillUnmount() {
try { window.removeEventListener('scroll', this._onScroll); } catch (e) {}
}
catalogue() {
return [
{ id: 'bottle', cat: 'Drinkware', name: 'Insulated steel bottle 500ml', moq: 50, method: 'Laser engraving', tint: '#DCE8FF', desc: 'Double-walled stainless steel bottle that keeps drinks cold through a working day. Engraved logo that will not wear off.' },
{ id: 'mug', cat: 'Drinkware', name: 'Insulated travel mug', moq: 50, method: 'Print or engraving', tint: '#FFDDC7', desc: 'Double-walled steel travel mug with a handle and a slide lid. Your logo printed or engraved on the body.' },
{ id: 'tote', cat: 'Bags', name: 'Organic cotton tote', moq: 100, method: 'Screen print', tint: '#FFE9B8', desc: 'Heavy organic cotton tote with long handles. A large print area on both sides.' },
{ id: 'drawstring', cat: 'Bags', name: 'Recycled cotton drawstring bag', moq: 100, method: 'Screen print', tint: '#E6DEFF', desc: 'Drawstring bag in recycled cotton with rope cords and reinforced corners. A large print area on the front.' },
{ id: 'hoodie', cat: 'Apparel', name: 'Heavyweight hoodie', moq: 25, method: 'Embroidery or print', tint: '#FFD9E0', desc: 'Brushed-back hoodie in a relaxed fit. Chest embroidery or a larger print on the back.' },
{ id: 'tee', cat: 'Apparel', name: 'Classic cotton tee', moq: 50, method: 'Screen print', tint: '#D6F2DE', desc: 'Mid-weight cotton t-shirt in a wide range of colours and sizes. Printed front, back or sleeve.' },
{ id: 'cap', cat: 'Apparel', name: 'Five-panel cap', moq: 50, method: 'Embroidery', tint: '#DCE8FF', desc: 'Structured cap with an adjustable strap. Embroidered logo on the front panel.' },
{ id: 'notebook', cat: 'Pens and stationery', name: 'Recycled notebook A5', moq: 50, method: 'Debossing', tint: '#D6F2DE', desc: 'Hardcover notebook with recycled paper, ribbon marker and elastic closure. Logo debossed into the cover.' },
{ id: 'pen', cat: 'Pens and stationery', name: 'Metal ballpoint pen', moq: 250, method: 'Laser engraving', tint: '#FFE9B8', desc: 'Weighted aluminium pen with a smooth click action. Engraved logo on the barrel.' },
{ id: 'powerbank', cat: 'Tech', name: 'Slim power bank 5000mAh', moq: 50, method: 'Full-colour print', tint: '#E6DEFF', desc: 'Pocket-size power bank with USB-C. Edge-to-edge print on the top face.' },
{ id: 'charger', cat: 'Tech', name: 'Wireless charging pad', moq: 50, method: 'Full-colour print', tint: '#FFD9E0', desc: 'Low-profile wireless charger for desks and meeting rooms. Printed logo in the centre.' },
{ id: 'lunchbox', cat: 'Eco range', name: 'Bamboo fibre lunch box', moq: 100, method: 'Laser engraving', tint: '#FFDDC7', desc: 'Lunch box with a bamboo lid and elastic strap. Logo engraved into the lid.' }
];
}
renderVals() {
const brand = this.props.accent ?? '#008FC9';
const accent = 'color-mix(in srgb, ' + brand + ' 76%, #000000)';
const dark = 'color-mix(in srgb, ' + brand + ' 50%, #020617)';
const soft = 'color-mix(in srgb, ' + brand + ' 10%, #FFFFFF)';
const s = this.state || {};
const view = s.view || 'shop';
const cat = s.cat || 'All';
const q = (s.q || '').trim().toLowerCase();
const list = s.list || {};
const all = this.catalogue();
const step = 25;
const sort = s.sort || 'featured';
const top = () => { try { window.scrollTo(0, 0); } catch (e) {} };
const toast = (text) => this.setState({ toastN: ((this.state || {}).toastN || 0) + 1, toastText: text });
const flags = (x) => ({ mugImg: x.id === 'mug', teeImg: x.id === 'tee', toteImg: x.id === 'tote', pbImg: x.id === 'powerbank', nbImg: x.id === 'notebook', dsImg: x.id === 'drawstring', capImg: x.id === 'cap', penImg: x.id === 'pen', noImg: ['mug', 'tee', 'tote', 'powerbank', 'notebook', 'drawstring', 'cap', 'pen'].indexOf(x.id) === -1 });
const setQty = (id, qty) => {
const next = Object.assign({}, (this.state || {}).list || {});
if (qty === null) { delete next[id]; } else { next[id] = qty; }
this.setState({ list: next });
};
const catNames = ['All', 'Drinkware', 'Bags', 'Apparel', 'Pens and stationery', 'Tech', 'Eco range'];
const cats = catNames.map((label) => {
const active = label === cat;
return {
label: label,
pressed: active ? 'true' : 'false',
bg: active ? accent : '#FFFFFF',
fg: active ? '#FFFFFF' : '#0F172A',
border: active ? accent : '#CBD5E1',
pick: () => this.setState({ cat: label })
};
});
const shown = all.filter((x) => (cat === 'All' || x.cat === cat) && (q === '' || (x.name + ' ' + x.cat).toLowerCase().indexOf(q) !== -1));
if (sort === 'az') { shown.sort((a, b) => a.name.localeCompare(b.name)); }
if (sort === 'moq') { shown.sort((a, b) => a.moq - b.moq); }
const products = shown.map((x) => {
const added = list[x.id] !== undefined;
return Object.assign({}, x, flags(x), {
openLabel: 'View ' + x.name,
addLabel: added ? 'Added to enquiry' : 'Add to enquiry',
addBg: added ? soft : accent,
addFg: added ? dark : '#FFFFFF',
addBorder: added ? soft : accent,
open: () => { this.setState({ view: 'product', pid: x.id, draft: null }); top(); },
toggle: () => { setQty(x.id, added ? null : x.moq); toast(added ? x.name + ' removed from your list' : x.name + ' added to your list'); }
});
});
const p0 = all.find((x) => x.id === s.pid) || all[0];
const p = Object.assign({}, p0, flags(p0));
const draft = s.draft || list[p.id] || p.moq;
const inList = list[p.id] !== undefined;
const items = all.filter((x) => list[x.id] !== undefined).map((x) => {
const qty = list[x.id];
return Object.assign(flags(x), {
name: x.name,
method: x.method,
tint: x.tint,
qty: qty,
decLabel: 'Decrease quantity of ' + x.name,
incLabel: 'Increase quantity of ' + x.name,
removeLabel: 'Remove ' + x.name,
inc: () => setQty(x.id, qty + step),
dec: () => setQty(x.id, Math.max(x.moq, qty - step)),
remove: () => setQty(x.id, null)
});
});
return {
accent: accent,
brand: brand,
dark: dark,
soft: soft,
isShop: view === 'shop',
isProduct: view === 'product',
isEnquiry: view === 'enquiry',
isSent: view === 'sent',
cats: cats,
products: products,
noResults: products.length === 0,
onSearch: (e) => this.setState({ q: e.target.value, view: 'shop' }),
p: p,
draft: draft,
draftInc: () => this.setState({ draft: draft + step }),
draftDec: () => this.setState({ draft: Math.max(p.moq, draft - step) }),
addCurrent: () => { setQty(p.id, draft); this.setState({ view: 'enquiry' }); toast(p.name + ' added to your list'); top(); },
addCurrentLabel: inList ? 'Update enquiry list' : 'Add to enquiry list',
items: items,
count: items.length,
hasItems: items.length > 0,
noItems: items.length === 0,
goShop: () => { this.setState({ view: 'shop' }); top(); },
goEnquiry: () => { this.setState({ view: 'enquiry' }); top(); },
send: () => {
const val = (id) => { const el = document.getElementById(id); return el ? String(el.value || '').trim() : ''; };
const nameErr = val('enq-name') === '';
const emailErr = !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val('enq-email'));
if (nameErr || emailErr) {
this.setState({ nameErr: nameErr, emailErr: emailErr });
const first = document.getElementById(nameErr ? 'enq-name' : 'enq-email');
if (first) { first.focus(); }
return;
}
this.setState({ view: 'sent', list: {}, nameErr: false, emailErr: false });
top();
},
nameErr: !!s.nameErr,
emailErr: !!s.emailErr,
nameInvalid: s.nameErr ? 'true' : 'false',
emailInvalid: s.emailErr ? 'true' : 'false',
clearName: () => { if ((this.state || {}).nameErr) { this.setState({ nameErr: false }); } },
clearEmail: () => { if ((this.state || {}).emailErr) { this.setState({ emailErr: false }); } },
onSort: (e) => this.setState({ sort: e.target.value }),
gridKey: cat + '|' + q + '|' + sort,
resultLabel: products.length === 1 ? '1 product' : products.length + ' products',
countEven: items.length % 2 === 0,
countOdd: items.length % 2 === 1,
toastA: (s.toastN || 0) % 2 === 1,
toastB: (s.toastN || 0) > 0 && (s.toastN || 0) % 2 === 0,
toastText: s.toastText || '',
showBar: items.length > 0 && (view === 'shop' || view === 'product'),
barLabel: 'View enquiry list (' + items.length + ')'
};
}
}
DC.mount(Component, {"accent": "#008FC9"}, { persist: { name: 'brandit-enquiry', keys: ['list'] } });
</script>
</body>
</html>
